# SBC Analytics production stack: app + PostgreSQL (accounts, sites) + ClickHouse (events).
# Run from this folder:  docker compose up -d --build
name: sbc-analytics

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  clickhouse:
    image: clickhouse/clickhouse-server:25.11.5.8-alpine
    restart: always
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  app:
    build:
      context: ..
      args:
        MIX_ENV: ce
    image: sbc-analytics:latest
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    environment:
      TMPDIR: /var/lib/plausible/tmp
      # Built-in HTTPS: requests a Let's Encrypt certificate for BASE_URL's host
      HTTP_PORT: 80
      HTTPS_PORT: 443
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  app-data:
